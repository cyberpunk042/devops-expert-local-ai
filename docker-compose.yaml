services:
  localai:
    build:
      context: .
      dockerfile: Dockerfile.localai
    # Local image name — Dockerfile pins the upstream LocalAI version.
    # To upgrade: edit FROM in Dockerfile.localai, then run: make setup-force
    image: aicp-localai:latest
    ports:
      - "8090:8080"
    volumes:
      - ./models:/models
      - localai-backends:/backends
      - ./data:/data
    environment:
      - THREADS=${THREADS:-4}
      - MODELS_PATH=/models
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LOCALAI_LOG_LEVEL=${LOCALAI_LOG_LEVEL:-info}
      # ── Performance ──
      # LocalAI divides context by LLAMACPP_PARALLEL slots
      # PARALLEL=2, CONTEXT=16384 → 8192 per slot (fits 8GB VRAM)
      - LLAMACPP_PARALLEL=${LLAMACPP_PARALLEL:-2}
      - CONTEXT_SIZE=${CONTEXT_SIZE:-16384}
      # PARALLEL_REQUESTS must be true for LLAMACPP_PARALLEL to work
      - LOCALAI_PARALLEL_REQUESTS=true
      # ── Watchdog: auto-recover stuck or idle backends ──
      - LOCALAI_WATCHDOG_IDLE=true
      - LOCALAI_WATCHDOG_IDLE_TIMEOUT=15m
      - LOCALAI_WATCHDOG_BUSY=true
      - LOCALAI_WATCHDOG_BUSY_TIMEOUT=10m
      # ── Model management ──
      # LRU eviction: max 3 backends (hermes + nomic-embed + bge-reranker)
      - LOCALAI_SINGLE_ACTIVE_BACKEND=false
      - LOCALAI_MAX_ACTIVE_BACKENDS=3
      # ── Persistence ──
      # Stores, KB collections, and agent state persist to host via ./data
      - LOCALAI_DATA_PATH=/data
      # ── Observability ──
      # /metrics endpoint is enabled by default (Prometheus format)
      # To disable: LOCALAI_DISABLE_METRICS_ENDPOINT=true
      - LOCALAI_ENABLE_TRACING=${LOCALAI_ENABLE_TRACING:-true}
      - LOCALAI_TRACING_MAX_ITEMS=${LOCALAI_TRACING_MAX_ITEMS:-2048}
      - LOCALAI_LOG_FORMAT=${LOCALAI_LOG_FORMAT:-json}
      # ── Auth (set in .env, empty = disabled) ──
      - LOCALAI_API_KEY=${LOCALAI_API_KEY:-}
    # ── Health check: model API responsive ──
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    devices:
      - /dev/dxg:/dev/dxg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: "${DOCKER_CPU_LIMIT:-4.0}"
    restart: unless-stopped

  # ── Observability stack (E-M44) ──
  # Start with: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-aicp}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

volumes:
  localai-backends:
  prometheus-data:
  grafana-data:
