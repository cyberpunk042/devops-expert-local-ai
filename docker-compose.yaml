services:
  localai:
    build:
      context: .
      dockerfile: Dockerfile.localai
    # Local image name — Dockerfile pins the upstream LocalAI version.
    # To upgrade: edit FROM in Dockerfile.localai, then run: make setup-force
    image: aicp-localai:latest
    ports:
      - "8090:8080"
    volumes:
      - ./models:/models
      - localai-backends:/backends
      - ./data:/data
    environment:
      - THREADS=${THREADS:-4}
      - MODELS_PATH=/models
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LOCALAI_LOG_LEVEL=${LOCALAI_LOG_LEVEL:-info}
      # ── Performance ──
      # LocalAI divides context by LLAMACPP_PARALLEL slots
      # PARALLEL=2, CONTEXT=16384 → 8192 per slot (fits 8GB VRAM)
      - LLAMACPP_PARALLEL=${LLAMACPP_PARALLEL:-2}
      - CONTEXT_SIZE=${CONTEXT_SIZE:-16384}
      # PARALLEL_REQUESTS must be true for LLAMACPP_PARALLEL to work
      - LOCALAI_PARALLEL_REQUESTS=true
      # ── Watchdog: auto-recover stuck or idle backends ──
      - LOCALAI_WATCHDOG_IDLE=true
      - LOCALAI_WATCHDOG_IDLE_TIMEOUT=15m
      - LOCALAI_WATCHDOG_BUSY=true
      - LOCALAI_WATCHDOG_BUSY_TIMEOUT=10m
      # ── Model management ──
      # LRU eviction: max 3 backends (hermes + nomic-embed + bge-reranker)
      - LOCALAI_SINGLE_ACTIVE_BACKEND=false
      - LOCALAI_MAX_ACTIVE_BACKENDS=3
      # ── Persistence ──
      # Stores, KB collections, and agent state persist to host via ./data
      - LOCALAI_DATA_PATH=/data
      # ── Observability ──
      # /metrics endpoint is enabled by default (Prometheus format)
      # To disable: LOCALAI_DISABLE_METRICS_ENDPOINT=true
      - LOCALAI_ENABLE_TRACING=${LOCALAI_ENABLE_TRACING:-true}
      - LOCALAI_TRACING_MAX_ITEMS=${LOCALAI_TRACING_MAX_ITEMS:-2048}
      - LOCALAI_LOG_FORMAT=${LOCALAI_LOG_FORMAT:-json}
      # ── Auth (set in .env, empty = disabled) ──
      - LOCALAI_API_KEY=${LOCALAI_API_KEY:-}
    devices:
      - /dev/dxg:/dev/dxg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  localai-backends:
