services:
  localai:
    build:
      context: .
      dockerfile: Dockerfile.localai
    # Local image name — Dockerfile pins the upstream LocalAI version.
    # To upgrade: edit FROM in Dockerfile.localai, then run: make setup-force
    image: aicp-localai:latest
    ports:
      - "8090:8080"
    volumes:
      - ./models:/models
    environment:
      - THREADS=${THREADS:-4}
      - MODELS_PATH=/models
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LOCALAI_LOG_LEVEL=${LOCALAI_LOG_LEVEL:-info}
    devices:
      - /dev/dxg:/dev/dxg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped
