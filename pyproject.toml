[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicp"
version = "0.1.0"
description = "AI Control Platform — orchestrate local and cloud AI backends"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
aicp = "aicp.cli.main:main"
aicp-agent = "aicp.agent.server:_cli_main"

[tool.setuptools.packages.find]
include = ["aicp*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
