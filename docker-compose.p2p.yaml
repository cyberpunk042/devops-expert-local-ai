# P2P Federated overlay — every node is equal (serves + routes)
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.p2p.yaml up -d
#   (or: make local-up-p2p)
#
# Requires: LOCALAI_P2P_TOKEN in .env (auto-generated on first start, then shared)
#
# This overlay:
#   - Enables P2P federated mode on every node (each can route to any other)
#   - Pins P2P listen port to 9876 for firewall predictability
#   - Uses default DHT + mDNS for peer discovery
#   - Nodes on the same LAN find each other automatically via mDNS
#   - Shared P2P token ensures only your fleet nodes connect
#
# All fleet machines use this same overlay. No primary/worker distinction.

services:
  localai:
    ports:
      - "9876:9876"
    environment:
      # ── P2P ──
      - LOCALAI_P2P=true
      - LOCALAI_FEDERATED=true
      - LOCALAI_P2P_TOKEN=${LOCALAI_P2P_TOKEN:-}
      - LOCALAI_P2P_NETWORK_ID=${LOCALAI_P2P_NETWORK_ID:-aicp-fleet}
      - LOCALAI_P2P_LISTEN_MADDRS=/ip4/0.0.0.0/tcp/9876
      - LOCALAI_P2P_LOGLEVEL=${LOCALAI_P2P_LOGLEVEL:-info}
