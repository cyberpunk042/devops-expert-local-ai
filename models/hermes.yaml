name: hermes
backend: cuda12-llama-cpp
parameters:
  batch: 2048
  seed: 42
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  repeat_penalty: 1.1
  top_k: 40
  model: hermes-2-pro-mistral-7b.Q4_K_M.gguf
  temperature: 0.0
  top_p: 0.85
threads: 2
gpu_layers: 32

# ── KV cache quantization (4x VRAM savings) ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (grammar-constrained) ──
function:
  parallel_calls: true
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: hermes-cache
prompt_cache_all: true
context_size: 16384
mmap: true
mmlock: true
