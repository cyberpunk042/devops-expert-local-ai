name: phi-2
backend: cuda12-llama-cpp
parameters:
  seed: -1
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  repeat_penalty: 1.1
  top_k: 40
  model: phi-2.Q4_K_M.gguf
  temperature: 0.7
  top_p: 0.85
threads: 2
gpu_layers: 0
# ── KV cache quantization (4x VRAM savings) ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (grammar-constrained) ──
function:
  parallel_calls: false
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: phi-2-cache
prompt_cache_all: true
context_size: 16384
batch_size: 2048
mmap: true
mmlock: true
