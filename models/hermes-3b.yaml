name: hermes-3b
backend: cuda12-llama-cpp
parameters:
  seed: -1
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  top_k: 40
  model: Hermes-3-Llama-3.2-3B-Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.85
  repeat_penalty: 1.1
threads: 4
gpu_layers: 32

# ── KV cache quantization (4x VRAM savings) ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (grammar-constrained for reliability) ──
function:
  parallel_calls: false
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: hermes-3b-cache
prompt_cache_all: true
context_size: 16384
batch_size: 2048
mmap: true
mmlock: true
