name: codellama
backend: cuda12-llama-cpp

parameters:
  model: codellama-7b-instruct.Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1

threads: 7
gpu_layers: 99

# Prompt template — CodeLlama Instruct uses Llama 2 format
template:
  chat_message: |
    [INST] {{.Content}} [/INST]
  chat: |
    {{.Input}}
stopwords:
  - "[INST]"
  - "[/INST]"

prompt_cache_path: codellama-cache
prompt_cache_all: true

# ── KV cache quantization (4x VRAM savings) ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (grammar-constrained) ──
function:
  parallel_calls: false
  mixed_mode: false
context_size: 16384
