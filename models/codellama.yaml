name: codellama
backend: cuda12-llama-cpp

parameters:
  model: codellama-7b-instruct.Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1

context_size: 8192
threads: 7
gpu_layers: 99

# Prompt template — CodeLlama Instruct uses Llama 2 format
template:
  chat_message: |
    [INST] {{.Content}} [/INST]
  chat: |
    {{.Input}}
stopwords:
  - "[INST]"
  - "[/INST]"

prompt_cache_path: codellama-cache
prompt_cache_all: true
