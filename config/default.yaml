# AICP default configuration

defaults:
  mode: think
  backend: local

backends:
  local:
    base_url: "http://localhost:8080"
    model: "default"
  claude:
    model: "opus"
    max_turns: 10
    timeout: 300
    # max_budget_usd: 1.00  # uncomment to set a cost cap

guardrails:
  forbidden_patterns:
    - ".env"
    - ".env.*"
    - "*.key"
    - "*.pem"
    - "*credentials*"
    - "*secret*"
