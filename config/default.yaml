defaults:
  mode: think
  backend: local
backends:
  local:
    base_url: http://localhost:8090
    model: hermes
    max_tokens: 2048
    embedding_model: nomic-embed
    code_model: codellama
    vision_model: llava
    whisper_model: whisper-1
    tts_model: piper-tts
    image_model: stablediffusion
    reranker_model: bge-reranker-v2-m3
    sound_model: transformers-musicgen
    cache_prompt: true
    auto_route: true
  claude:
    model: opus
    max_turns: 10
    timeout: 300
rag:
  enabled: false
  db_path: .aicp/rag.db
  store_name: default
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  threshold: 0.3
  rerank: true
  max_context_chars: 3000
stores:
  default_store: default
guardrails:
  forbidden_patterns:
  - .env
  - .env.*
  - '*.key'
  - '*.pem'
  - '*credentials*'
  - '*secret*'
cluster:
  config_file: config/fleet.yaml
  auto_route: true
