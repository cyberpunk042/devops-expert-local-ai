# AICP default configuration

defaults:
  mode: think
  backend: local

backends:
  local:
    base_url: "http://localhost:8090"
    model: "hermes"
    max_tokens: 2048
    # Multi-model: specialized models for different task types
    embedding_model: "nomic-embed"
    code_model: "codellama"
    vision_model: "llava"
    # Audio models: whisper for STT, piper for TTS
    whisper_model: "whisper-1"
    tts_model: "piper-tts"
    # Image generation model (Stable Diffusion via stablediffusion-ggml backend)
    image_model: "stablediffusion"
    # Reranker model (cross-encoder for RAG result reranking)
    reranker_model: "bge-reranker-v2-m3"
    # Prompt caching: reuse KV cache for repeated system prompts (faster warm calls)
    cache_prompt: true
    # auto_route: when true, AICP picks hermes vs codellama based on task keywords.
    # When false (default), always uses the primary model unless explicitly overridden.
    auto_route: false
    # Sampling overrides — these override model YAML defaults per-request.
    # Uncomment to tune from AICP side (useful for mode-specific behavior).
    # temperature: 0.7
    # top_p: 0.9
    # top_k: 40
    # repeat_penalty: 1.1
    # API key for LocalAI (must match LOCALAI_API_KEY in .env / docker-compose)
    # api_key: ""
  claude:
    model: "opus"
    max_turns: 10
    timeout: 300
    # max_budget_usd: 1.00  # uncomment to set a cost cap

rag:
  enabled: false
  # SQLite database path for vector store (relative to project or absolute)
  db_path: ".aicp/rag.db"
  store_name: "default"
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  threshold: 0.3
  # Cross-encoder reranking: improves search precision after embedding retrieval
  rerank: true
  # Max characters of retrieved context injected into prompts
  max_context_chars: 3000

guardrails:
  forbidden_patterns:
    - ".env"
    - ".env.*"
    - "*.key"
    - "*.pem"
    - "*credentials*"
    - "*secret*"
  # allowed_paths restricts Edit/Act mode to specific directories.
  # Uncomment and set to limit scope — useful for shared machines.
  # allowed_paths:
  #   - /home/youruser/projects
