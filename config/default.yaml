# AICP default configuration

defaults:
  mode: think
  backend: local

backends:
  local:
    base_url: "http://localhost:8090"
    model: "hermes"
    max_tokens: 2048
  claude:
    model: "opus"
    max_turns: 10
    timeout: 300
    # max_budget_usd: 1.00  # uncomment to set a cost cap

guardrails:
  forbidden_patterns:
    - ".env"
    - ".env.*"
    - "*.key"
    - "*.pem"
    - "*credentials*"
    - "*secret*"
  # allowed_paths restricts Edit/Act mode to specific directories.
  # Uncomment and set to limit scope — useful for shared machines.
  # allowed_paths:
  #   - /home/youruser/projects
