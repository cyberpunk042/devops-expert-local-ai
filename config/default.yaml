defaults:
  mode: think
  backend: local
backends:
  local:
    base_url: http://localhost:8090
    model: qwen3-8b
    max_tokens: 4096
    embedding_model: nomic-embed
    code_model: qwen3-8b
    vision_model: llava        # or gemma4-e4b (multimodal: text+image+audio in one model)
    whisper_model: whisper-1
    tts_model: piper-tts
    image_model: sd35-medium     # SD 3.5 Medium (falls back to stablediffusion v1.5 if unavailable)
    reranker_model: bge-reranker-v2-m3
    sound_model: transformers-musicgen
    fleet_model: qwen3-4b
    # Qwen3 fast model (no thinking mode) for structured/simple tasks
    fast_model: qwen3-8b-fast
    cache_prompt: true
    auto_route: true
    # Advanced sampling (uncomment to override defaults):
    # mirostat: 0          # 0=disabled, 1=Mirostat, 2=Mirostat 2.0
    # mirostat_tau: 5.0    # Target entropy
    # mirostat_eta: 0.1    # Learning rate
    # typical_p: 1.0       # Locally typical sampling threshold
    # frequency_penalty: 0.0
    # presence_penalty: 0.0
  openrouter:
    # OpenRouter: 200+ models, 29 free. Zero-cost middle tier.
    # Set OPENROUTER_API_KEY in .env to enable.
    # model: qwen/qwen3-8b:free     (default free model)
    # free_model: qwen/qwen3-8b:free
    # free_only: true                (restrict to $0 models)
    max_tokens: 4096
    timeout: 120
  k2_6_openrouter:
    # Kimi K2.6 via OpenRouter — premium-cheap agentic tier (E011-m002).
    # MIT-licensed, 1T/32B-active MoE, agentic frontier per second brain synthesis at
    # ~/devops-solutions-research-wiki/wiki/sources/tools-integration/src-kimi-k2-6-moonshot-agent-swarm.md
    # ~$0.60/$2.50 per M tokens (OpenRouter advertised), ~6-7× cheaper than Opus through OpenRouter.
    # Reuses OpenRouterBackend (same OpenAI-compatible HTTP shape) — see aicp/backends/openrouter.py.
    # Auto-routing to this tier deferred to E011-m001 (router refactor); operator opts in via --backend k2_6_openrouter.
    model: moonshotai/kimi-k2.6
    max_tokens: 8192          # K2.6 runs long agentic sessions
    timeout: 300              # generous for multi-tool-call sequences
    enabled: true
  k2_6_local:
    # Kimi K2.6 Q2 GGUF served by llama.cpp — sovereignty fallback ONLY, not a routing tier.
    # Empirically measured 2026-04-24 on Tier 0 (X299 + DDR4-2666 + WSL + PCIe 3.0):
    # 0.045 tok/s thinking-on, 0.10 tok/s thinking-off. 60-90 min cold reload after WSL restart.
    # Out of default failover_chain and tier_map — opt-in via `--backend k2_6_local` for
    # sovereignty tests / offline mode only. See docs/EXPLORATION-LOG-LOCAL-K26-EMPIRICAL-2026-04-24.md.
    base_url: http://localhost:8091
    model: kimi-k2.6-q2
    max_tokens: 8192
    timeout: 1800             # cold mmap can take 60+ min on this hardware
    enabled: false
  rlm_local:
    # RLM-Qwen3-8B (mit-oasys/rlm-qwen3-8b-v0.1) GGUF q8_0 served by llama.cpp on port 8092.
    # 8B Qwen3-8B finetune post-trained for the Recursive Language Model paradigm (arXiv 2512.24601).
    # Empirically measured 2026-04-27 on Tier 0 (RTX 2080 Ti, GPU offload -ngl 99, 32K ctx):
    # decode ~28.7 tok/s, prompt eval ~79 tok/s — interactive-grade.
    # VRAM footprint: 10.8/11.3 GB on the 2080 Ti (model + 32K KV cache + 8GB prompt cache).
    # Plain backend (this stanza) gives the fine-tuned model directly via OpenAI-compat.
    # Full RLM paradigm (REPL-recursion → ~3.2M+ effective context) requires the RLM SDK
    # (`pip install rlms`, alexzhang13/rlm) layered on top — not yet wired.
    # Out of default tier_map — opt-in via `--backend rlm_local` for long-context / recursive work.
    base_url: http://localhost:8092
    model: rlm-qwen3-8b
    max_tokens: 8192
    timeout: 300              # generous for cold model load + normal generation
    enabled: true
  ollama_cloud:
    # Ollama Cloud — subscription-flat agentic tier. Pro $20/mo USD (~30M tokens/mo effective,
    # 5hr session / 7d weekly caps), Max $100/mo USD (5× Pro). Bearer auth via OLLAMA_API_KEY.
    # PRIVACY: shared inference pool — NEVER route client-monetizable or audit-sensitive work
    # here. Use k2_6_openrouter (pinned provider) or k2_6_local (sovereignty) for those.
    # Catalog (verified 2026-04-24): kimi-k2.6, deepseek-v4-flash, glm-4.7-flash, glm-5.1,
    # qwen3-coder-next, qwen3.6, nemotron-3-super, gemma4, devstral-small-2, ...
    base_url: https://ollama.com/v1
    model: kimi-k2.6
    max_tokens: 8192
    timeout: 300
    enabled: true
  claude:
    model: opus
    max_turns: 10
    timeout: 300
circuit_breaker:
  # E011-m004 — per-backend tuning. Global defaults apply to anything not in per_backend.
  # Failure semantics differ per tier: local should fail fast (recover fast), K2.6 over
  # network tolerates transient hiccups, Claude is last-resort so open late.
  failure_threshold: 3
  recovery_timeout: 30
  half_open_max: 1
  per_backend:
    local:
      failure_threshold: 2        # local recovers fast — fail fast, retry fast
      recovery_timeout: 10
    k2_6_local:
      failure_threshold: 3        # llama.cpp cold-start can appear to fail; retry before opening
      recovery_timeout: 15
    rlm_local:
      failure_threshold: 3        # llama.cpp restarts; allow some hiccup tolerance
      recovery_timeout: 15
    k2_6_openrouter:
      failure_threshold: 3        # transient network / OpenRouter hiccups are common
      recovery_timeout: 30
    openrouter:
      failure_threshold: 3
      recovery_timeout: 30
    claude:
      failure_threshold: 5        # Anthropic-direct is last resort — open reluctantly
      recovery_timeout: 120
router:
  # E011-m001 — 5-tier routing via tier_map (opt-in; absence preserves legacy 3-tier logic).
  # Score → band index = count of thresholds exceeded; band index → backend via tier_map.
  # k2_6_local is sovereignty-fallback only (too slow at 0.045-0.10 tok/s on Tier 0 hardware) —
  # NOT in default chain. Opt in explicitly via `--backend k2_6_local`.
  #   0.00–0.25 local           (Qwen3-8B etc. on LocalAI)
  #   0.25–0.45 k2_6_openrouter (cheap agentic — the cost-savings win)
  #   0.45–0.70 k2_6_openrouter (still cheap agentic)
  #   0.70–0.90 openrouter      (Opus 4.7 / GPT-5.4 online fallback)
  #   0.90–1.00 claude          (Anthropic direct — last resort)
  complexity_thresholds: [0.25, 0.45, 0.70, 0.90]
  failover_chain: [local, k2_6_openrouter, openrouter, claude]
  tier_map:
    0: local
    1: k2_6_openrouter
    2: k2_6_openrouter
    3: openrouter
    4: claude
  force_cloud_modes: [edit, act]
rag:
  enabled: true
  db_path: .aicp/rag.db
  store_name: default
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  threshold: 0.3
  rerank: true
  max_context_chars: 3000
  # Auto-indexing: watch project files and re-embed on change
  auto_index: true
  auto_index_interval: 30       # seconds between polls
  auto_index_extensions:        # file types to index (empty = defaults)
    - .py
    - .md
    - .yaml
    - .yml
    - .json
    - .toml
    - .sh
stores:
  default_store: default
guardrails:
  forbidden_patterns:
  - .env
  - .env.*
  - '*.key'
  - '*.pem'
  - '*credentials*'
  - '*secret*'
cluster:
  config_file: config/fleet.yaml
  auto_route: true
