# fleet-light profile — minimal footprint for fleet heartbeat duty.
#
# Uses Gemma 4 E2B (2.3B effective, 2.9GB) for everything. Benchmarked at
# 51.7 tok/s vs qwen3-4b's 2.6 tok/s — 20x faster on simple Q&A, smaller
# VRAM (~4GB), and multimodal (text+image+audio) as a bonus.
# Zero RAG, minimal budgets. Designed for fleet nodes handling heartbeats,
# status checks, and simple agent tasks.

name: fleet-light
description: "Fleet heartbeat duty — gemma4-e2b, zero RAG, minimal footprint"
extends: default

backends:
  local:
    model: gemma4-e2b
    fast_model: gemma4-e2b
    fleet_model: gemma4-e2b
    code_model: gemma4-e2b
    max_tokens: 1024
    cache_prompt: true
    auto_route: false

warmup:
  enabled: true
  models: [gemma4-e2b]
  timeout: 60

router:
  complexity_thresholds: [0.6, 0.9]
  failover_chain: [local, fleet]

mode_profiles:
  think: { temperature: 0.3 }
  edit:  { temperature: 0.2 }
  act:   { temperature: 0.1 }

rag:
  enabled: false

budget:
  max_cost_usd: 0.0
  max_duration_seconds: 60
  max_steps: 5

cache:
  enabled: true
  ttl_seconds: 900
  max_entries: 64

quality:
  threshold: 0.10

timeouts:
  request: 30
  cold_start: 30
  cold_start_interval: 3
  retries: 2

docker:
  context_size: 8192
  parallel_slots: 2
  mem_limit: "8G"
