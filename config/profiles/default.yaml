# default profile — codifies current AICP behavior as the baseline.
#
# All other profiles extend this one. Every setting here represents
# the "normal" operating mode. Values match what's in config/default.yaml
# and the hardcoded defaults across router.py, controller.py, localai.py.
#
# This file serves as documentation of all profile-configurable settings.

name: default
description: "Balanced operation — current AICP defaults"

# --- Backend settings ---
backends:
  local:
    model: qwen3-8b
    fast_model: qwen3-8b-fast
    fleet_model: qwen3-4b
    code_model: qwen3-8b
    max_tokens: 4096
    cache_prompt: true
    auto_route: true
  claude:
    model: opus
    max_turns: 10
    timeout: 300
  openrouter:
    max_tokens: 4096
    timeout: 120

# --- Router settings ---
# complexity_thresholds: [low_cutoff, high_cutoff]
#   score < low  → local
#   score < high → openrouter
#   score >= high → claude
# failover_chain: ordered list of backends to try on failure
# force_cloud_modes: modes that always route to cloud ([] to disable)
router:
  complexity_thresholds: [0.3, 0.6]
  failover_chain: [local, fleet, openrouter, claude]
  force_cloud_modes: [edit, act]

# --- Sampling per mode ---
mode_profiles:
  think: { temperature: 0.7 }
  edit:  { temperature: 0.4 }
  act:   { temperature: 0.1 }

# --- RAG / Knowledge ---
rag:
  enabled: true
  top_k: 5
  threshold: 0.3
  rerank: true
  max_context_chars: 3000

# --- Budget ---
budget:
  max_cost_usd: 10.0
  max_duration_seconds: 600
  max_steps: 20
  max_file_changes: 50

# --- Cache ---
cache:
  enabled: true
  ttl_seconds: 300
  max_entries: 256

# --- Quality ---
quality:
  threshold: 0.25

# --- Timeouts ---
timeouts:
  request: 120
  cold_start: 60
  cold_start_interval: 5
  retries: 3

# --- Warmup (Stage 4 — pre-load models at agent startup) ---
warmup:
  enabled: false              # set true for fleet nodes
  models: [qwen3-8b]          # models to pre-load
  timeout: 120                # total warmup budget in seconds

# --- Circuit Breaker (Stage 4 — prevent thundering herd) ---
circuit_breaker:
  failure_threshold: 3       # consecutive failures before opening
  recovery_timeout: 30       # seconds before half-open probe
  half_open_max: 1           # concurrent probes allowed in half-open

# --- Dead-Letter Queue (Stage 4 — persist failed tasks for retry) ---
dlq:
  enabled: true
  max_retries: 3              # max retry attempts per entry
  retry_delay_seconds: 300    # minimum delay between retries
  max_entries: 1000           # max DLQ entries before pruning

# --- Metrics persistence (Stage 4 — survive restarts) ---
metrics:
  persist: true
  snapshot_interval: 60       # seconds between snapshot writes

# --- Health Reports (Stage 4 — proactive trend detection) ---
reports:
  enabled: false              # set true for production fleet nodes
  interval_hours: 6           # report generation interval
  retain_days: 30             # keep reports for N days
  notify_url: ""              # ntfy topic URL (optional)

# --- Docker (requires restart when changed) ---
docker:
  context_size: 16384
  threads: 4
  parallel_slots: 2
  mem_limit: "12G"
