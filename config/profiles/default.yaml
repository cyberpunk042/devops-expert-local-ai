# default profile — codifies current AICP behavior as the baseline.
#
# All other profiles extend this one. Every setting here represents
# the "normal" operating mode. Values match what's in config/default.yaml
# and the hardcoded defaults across router.py, controller.py, localai.py.
#
# This file serves as documentation of all profile-configurable settings.

name: default
description: "Balanced operation — current AICP defaults"

# --- Backend settings ---
backends:
  local:
    model: qwen3-8b
    fast_model: qwen3-8b-fast
    fleet_model: qwen3-4b
    code_model: qwen3-8b
    max_tokens: 4096
    cache_prompt: true
    auto_route: true
  claude:
    model: opus
    max_turns: 10
    timeout: 300
  openrouter:
    max_tokens: 4096
    timeout: 120

# --- Router settings (E011-m001: 5-tier routing via tier_map) ---
# complexity_thresholds: N cutoffs → N+1 bands (mapped via tier_map below).
#   0.00–0.25 local           (Qwen3-8B etc. on LocalAI)
#   0.25–0.45 k2_6_openrouter (Kimi K2.6 via OpenRouter, audit-safe pinned)
#   0.45–0.70 k2_6_openrouter (Kimi K2.6 cont. — the cost-savings sweet spot)
#   0.70–0.90 openrouter      (Opus 4.7 / GPT-5.4 / Gemini fallback)
#   0.90–1.00 claude          (Anthropic-direct edge-case, hard-gated)
# k2_6_local is sovereignty-fallback only (0.045-0.10 tok/s on Tier 0) — opt in
# via `--backend k2_6_local`, NOT auto-routed. See `personal` profile to swap
# band 1 to ollama_cloud for non-monetizable workloads.
# failover_chain: order tried when a tier is unavailable. `fleet` is a special
# cluster-peer step handled by the controller (not a regular backend tier).
# force_cloud_modes: modes that always route to a non-local tier ([] to disable).
router:
  complexity_thresholds: [0.25, 0.45, 0.70, 0.90]
  failover_chain: [local, fleet, k2_6_openrouter, openrouter, claude]
  tier_map:
    0: local
    1: k2_6_openrouter
    2: k2_6_openrouter
    3: openrouter
    4: claude
  force_cloud_modes: [edit, act]

# --- Sampling per mode ---
mode_profiles:
  think: { temperature: 0.7 }
  edit:  { temperature: 0.4 }
  act:   { temperature: 0.1 }

# --- RAG / Knowledge ---
rag:
  enabled: true
  top_k: 5
  threshold: 0.3
  rerank: true
  max_context_chars: 3000

# --- Budget ---
budget:
  max_cost_usd: 10.0
  max_duration_seconds: 600
  max_steps: 20
  max_file_changes: 50

# --- Cache ---
cache:
  enabled: true
  ttl_seconds: 300
  max_entries: 256

# --- Quality ---
quality:
  threshold: 0.25

# --- Timeouts ---
timeouts:
  request: 120
  cold_start: 60
  cold_start_interval: 5
  retries: 3

# --- Warmup (Stage 4 — pre-load models at agent startup) ---
warmup:
  enabled: false              # set true for fleet nodes
  models: [qwen3-8b]          # models to pre-load
  timeout: 120                # total warmup budget in seconds

# --- Circuit Breaker (Stage 4 + E011-m004 per-backend tuning) ---
circuit_breaker:
  failure_threshold: 3       # consecutive failures before opening
  recovery_timeout: 30       # seconds before half-open probe
  half_open_max: 1           # concurrent probes allowed in half-open
  per_backend:               # tier-specific overrides (E011-m004)
    local:
      failure_threshold: 2        # local recovers fast — fail fast, retry fast
      recovery_timeout: 10
    k2_6_local:
      failure_threshold: 3        # cold mmap can take minutes — tolerate before opening
      recovery_timeout: 15
    k2_6_openrouter:
      failure_threshold: 3        # network / OpenRouter transients common
      recovery_timeout: 30
    openrouter:
      failure_threshold: 3
      recovery_timeout: 30
    claude:
      failure_threshold: 5        # last-resort — open reluctantly
      recovery_timeout: 120

# --- Dead-Letter Queue (Stage 4 — persist failed tasks for retry) ---
dlq:
  enabled: true
  max_retries: 3              # max retry attempts per entry
  retry_delay_seconds: 300    # minimum delay between retries
  max_entries: 1000           # max DLQ entries before pruning

# --- Metrics persistence (Stage 4 — survive restarts) ---
metrics:
  persist: true
  snapshot_interval: 60       # seconds between snapshot writes

# --- Health Reports (Stage 4 — proactive trend detection) ---
reports:
  enabled: false              # set true for production fleet nodes
  interval_hours: 6           # report generation interval
  retain_days: 30             # keep reports for N days
  notify_url: ""              # ntfy topic URL (optional)

# --- Model Swap Coordination (GPU VRAM management: LLM ↔ image model) ---
swap:
  batch_window_seconds: 30    # keep SD loaded for batch requests before swapping back
  swap_timeout_seconds: 60    # max time for a full swap cycle
  warmup_timeout_seconds: 45  # max time to wait for LLM reload after swap

# --- Docker (requires restart when changed) ---
docker:
  context_size: 32768           # 2x model context (16384) × parallel_slots (2)
  threads: 4
  parallel_slots: 2
  mem_limit: "12G"
