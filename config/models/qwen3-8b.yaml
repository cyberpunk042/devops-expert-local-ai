name: qwen3-8b
backend: cuda12-llama-cpp
parameters:
  batch: 2048
  seed: 42
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  top_k: 40
  model: Qwen3-8B-Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.85
  repeat_penalty: 1.1
threads: 2
gpu_layers: 33

# ── KV cache quantization (4x VRAM savings — critical for 8GB) ──
# Current: q4_0 (4-bit, proven stable)
# Future: turbo3 (3.25-bit, ~6x compression, zero accuracy loss)
#   When llama.cpp merges TurboQuant (track: github.com/ggml-org/llama.cpp/discussions/20969)
#   change to: cache_type_k: turbo3 / cache_type_v: turbo3
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (Qwen3 has native tool calling) ──
function:
  parallel_calls: true
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: qwen3-8b-cache
prompt_cache_all: true

# ── Context: 8192 safe on 8GB with KV quant; increase on higher VRAM ──
context_size: 8192
mmap: true
mmlock: true
