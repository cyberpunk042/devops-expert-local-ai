name: qwen3-8b
backend: cuda12-llama-cpp
parameters:
  batch: 2048
  seed: 42
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  top_k: 40
  model: Qwen3-8B-Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.85
  repeat_penalty: 1.1
threads: 2
gpu_layers: 33

# ── KV cache quantization (asymmetric — keys need more precision than values) ──
# q4_0 keys + q2_K values = ~6x compression, no quality loss on Qwen3
# Enables 16K context on 8GB VRAM (was 8K with symmetric q4_0)
# Future: turbo3 types when llama.cpp merges TurboQuant
#   (track: github.com/ggml-org/llama.cpp/discussions/20969)
cache_type_k: q4_0
cache_type_v: q2_K
flash_attention: true

# ── Function calling (Qwen3 has native tool calling) ──
function:
  parallel_calls: true
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: qwen3-8b-cache
prompt_cache_all: true

# ── Context: 16384 enabled by asymmetric KV quant (q4_0 K + q2_K V) ──
context_size: 16384
mmap: true
mmlock: true
