name: codellama
backend: cuda12-llama-cpp

parameters:
  batch: 2048
  seed: 42
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  model: codellama-7b-instruct.Q4_K_M.gguf
  temperature: 0.2
  top_p: 0.85
  top_k: 40
  repeat_penalty: 1.1

threads: 2
gpu_layers: 32

# Prompt template — CodeLlama Instruct uses Llama 2 format
template:
  chat_message: |
    [INST] {{.Content}} [/INST]
  chat: |
    {{.Input}}
stopwords:
  - "[INST]"
  - "[/INST]"

prompt_cache_path: codellama-cache
prompt_cache_all: true

# ── KV cache quantization (4x VRAM savings) ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling (grammar-constrained) ──
function:
  parallel_calls: false
  mixed_mode: false
context_size: 16384
mmap: true
mmlock: true
