name: qwen3-4b
backend: cuda12-llama-cpp
parameters:
  batch: 2048
  seed: 42
  max_tokens: 4096
  mirostat: 0
  min_p: 0.05
  top_k: 40
  model: Qwen3-4B-Q6_K.gguf
  temperature: 0.2
  top_p: 0.85
  repeat_penalty: 1.1
threads: 2
gpu_layers: 33

# ── KV cache quantization ──
cache_type_k: q4_0
cache_type_v: q4_0
flash_attention: true

# ── Function calling ──
function:
  parallel_calls: false
  mixed_mode: false

# ── Prompt caching ──
prompt_cache_path: qwen3-4b-cache
prompt_cache_all: true

# ── 4B model fits easily in 8GB — larger context possible ──
context_size: 16384
mmap: true
mmlock: true
