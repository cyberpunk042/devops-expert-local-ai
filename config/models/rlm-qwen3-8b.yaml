# Operator authorization required before:
#   1. `huggingface-cli download cameronbergh/rlm-qwen3-8b-v0.1-gguf rlm-qwen3-8b-v0.1-q8_0.gguf` (~8GB)
#       Target mount: TBD — operator picks per storage-tiers rule (NEVER WSL VDisk root)
#   2. Adding `rlm-qwen3-8b` to LocalAI's loaded model set in docker-compose
#   3. Adding `rlm-qwen3-8b` to the routing tier_map in config/default.yaml
# Per `feedback_never_unauthorized_large_disk_writes.md` (>100MB threshold rule).
#
# ── Architectural note: this config makes the FINE-TUNED MODEL available locally.
# The full RLM PARADIGM (REPL-recursion, ~3.2M+ effective context) requires the
# RLM SDK as a separate orchestration layer between AICP and this backend:
#   pip install rlms   (alexzhang13/rlm)
# Without the SDK, you get the fine-tuned Qwen3-8B as a regular backend (still useful,
# but loses the recursive long-context capability the model was post-trained for).
# Operator decision needed: deploy fine-tuned model as plain backend (Phase 1)
# vs add RLM SDK orchestration (Phase 2, full RLM paradigm).
